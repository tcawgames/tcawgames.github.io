<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Games | Playing</title>
    <link rel="icon" href="icons/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        :root {
            --bg-color: #050a06;
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.35);
            --text-color: #e2fce2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-color); }
        
        .player-shell { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        /* Top HUD Bar */
        .game-hud {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(11, 20, 11, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid #102610;
            padding: 8px 20px;
            border-radius: 40px;
            z-index: 1000;
            box-shadow: 0 4px 20px var(--neon-glow);
            transition: opacity 0.3s ease;
        }
        .game-hud.hidden { opacity: 0; pointer-events: none; }
        
        .hud-title { font-size: 0.9rem; font-weight: 600; color: var(--text-color); }
        
        .hud-btn {
            background: transparent;
            border: 1px solid #102610;
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hud-btn:hover { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 8px var(--neon-glow); }

        /* Iframe Frame */
        .frame-container { flex: 1; width: 100%; height: 100%; border: none; background: #000; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div class="player-shell">
        <!-- Floating HUD Control Bar -->
        <div class="game-hud" id="game-hud">
            <button class="hud-btn" onclick="window.location.href='index.html'" title="Return Home">
                <span class="material-icons" style="font-size: 18px;">arrow_back</span>
            </button>
            <span class="hud-title" id="game-title-display">Loading Game...</span>
            <button class="hud-btn" onclick="toggleFullscreen()" title="Fullscreen">
                <span class="material-icons" style="font-size: 18px;">fullscreen</span>
            </button>
        </div>

        <!-- The Game Frame Container -->
        <div class="frame-container">
            <iframe id="gameiframe" src="" allowfullscreen title="Game Frame"></iframe>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');
        const gameLink = params.get('link');

        if (gameId) {
            document.getElementById('game-title-display').textContent = gameId.toUpperCase();
        }

        if (gameLink) {
            // Assigns the folder path from games.json into the iframe source
            document.getElementById('gameiframe').src = gameLink;
        } else {
            document.getElementById('game-title-display').textContent = "Error: Game not found";
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
