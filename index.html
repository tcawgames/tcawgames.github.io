<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Clever | Portal</title>
    <link rel="icon" id="page-favicon" href="https://clever.com/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Educational Splash Screen (3 Seconds, No Redirect) -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-header">
                <span class="material-icons" style="font-size: 36px; color: #1a73e8;">school</span>
                <h2>Algebra I - Daily Practice</h2>
            </div>
            <p>Loading interactive math module: Solving Multi-Step Equations...</p>
            <div class="splash-loader"><div class="splash-bar"></div></div>
        </div>
    </div>

    <!-- Navbar -->
    <header class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="icons/logo.png" alt="Logo" class="nav-logo">
            <span>TcawMath</span>
        </a>
        <div class="nav-search">
            <span class="material-icons">search</span>
            <input type="text" id="search-input" placeholder="Search equations...">
        </div>
        <button class="settings-btn" id="open-settings">
            <span class="material-icons">settings</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Category Tabs Bar -->
        <nav class="tabs-bar" id="tabs-bar">
            <button class="tab-btn active" data-category="all">All</button>
            <button class="tab-btn" data-category="popular">Popular</button>
            <button class="tab-btn" data-category="recommended">Recommended</button>
        </nav>

        <!-- Dynamic Game Grid -->
        <section class="game-grid" id="game-grid">
            <!-- Populated dynamically via main.js -->
        </section>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>System Settings</h2>
                <button class="close-btn" id="close-settings"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <div class="setting-text">
                        <strong>Tab Disguise</strong>
                        <span>Hide the site title and icon</span>
                    </div>
                    <select id="tab-cloak" class="setting-select">
                        <option value="clever">Clever Portal</option>
                        <option value="default">TcawMath</option>
                        <option value="classroom">Google Classroom</option>
                        <option value="drive">Google Drive</option>
                    </select>
                </div>
                <div class="setting-item">
                    <div class="setting-text">
                        <strong>Panic Key</strong>
                        <span>Instantly redirects to Google Classroom</span>
                    </div>
                    <button id="panic-key-btn" class="keybind-btn">Key: `</button>
                </div>
                <div class="setting-item">
                    <div class="setting-text">
                        <strong>Neon Glow Intensity</strong>
                        <span>Adjust the UI lighting</span>
                    </div>
                    <input type="range" id="glow-slider" min="0" max="100" value="50">
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
